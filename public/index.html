<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AjoLabs</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0f0d;--tx:#f0f4f2;--mut:#96a09e;--dim:#606a68;--mint:#a8e8c5;--green:#64dea0;--line:rgba(255,255,255,.1);--card:rgba(255,255,255,.04);--red:#ec705c}
*{box-sizing:border-box;margin:0}
html,body{min-height:100%}
body{background:linear-gradient(180deg,#0e1316,#0a0e0d);color:var(--tx);font-family:Poppins,system-ui,sans-serif;font-weight:400;-webkit-font-smoothing:antialiased}
.glow{position:fixed;inset:0;pointer-events:none;background:radial-gradient(520px 520px at 85% 0%,rgba(20,70,45,.55),transparent 70%),radial-gradient(420px 420px at 0% 100%,rgba(14,22,46,.6),transparent 70%)}
header{position:relative;display:flex;align-items:center;justify-content:space-between;padding:20px 24px;max-width:1100px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;font-weight:500;font-size:20px}
.nav{color:var(--mut);text-decoration:none;font-size:14px}.nav:hover{color:var(--tx)}
.warn{border-color:rgba(236,112,92,.5);background:rgba(236,112,92,.07);margin-top:16px;font-size:14px;line-height:1.55}.warn b{font-weight:500}
.pill{font-size:12px;color:var(--mint);border:1px solid rgba(100,222,160,.4);background:rgba(100,222,160,.1);padding:5px 12px;border-radius:99px}
main{position:relative;max-width:1100px;margin:0 auto;padding:8px 24px 80px}
.eyebrow{font-size:12px;letter-spacing:.14em;color:var(--mut);text-transform:uppercase;margin-bottom:12px}
h1{font-weight:300;font-size:clamp(34px,6vw,56px);line-height:1.12}
h1 em{font-style:normal;color:var(--mint)}
.sub{color:var(--mut);margin-top:14px;font-size:15px;max-width:460px;line-height:1.6}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:start}
@media(max-width:820px){.grid{grid-template-columns:1fr;gap:28px}}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:24px}
label{display:block;font-size:12px;color:var(--mut);margin:14px 0 6px}
input,select{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--tx);border-radius:14px;padding:13px 14px;font:inherit;font-size:15px;outline:none}
input:focus,select:focus{border-color:rgba(100,222,160,.6)}
select option{background:#12181a}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.seg{display:flex;border:1px solid var(--line);border-radius:99px;padding:4px;gap:4px}
.seg button{flex:1;background:none;border:0;color:var(--mut);padding:10px;border-radius:99px;font:inherit;font-size:14px;cursor:pointer}
.seg button.on{background:rgba(255,255,255,.1);color:var(--tx)}
.btn{display:block;width:100%;margin-top:22px;border:0;border-radius:99px;padding:15px 20px;font:inherit;font-weight:500;font-size:16px;cursor:pointer;color:#0b1a12;background:linear-gradient(135deg,#b9f7d6,#3fd68b)}
.btn.ghost{background:none;color:var(--tx);border:1px solid var(--line);margin-top:10px}
.btn:disabled{opacity:.45;cursor:default}
.err{color:var(--red);font-size:13px;margin-top:12px;min-height:18px}
.tag{font-size:12px;color:var(--mut)}
.stage{position:relative;width:340px;height:340px;margin:0 auto}
.ring{position:absolute;inset:6px;border-radius:50%;border:8px solid rgba(255,255,255,.08)}
.hub{position:absolute;left:50%;top:50%;width:150px;height:150px;margin:-75px;border-radius:50%;background:#080c0b;border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;box-shadow:0 0 70px rgba(63,214,139,.18)}
.hub b{font-weight:500;font-size:26px}.hub span{font-size:12px;color:var(--mut)}
.seat{position:absolute;width:56px;height:56px;margin:-28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:18px;color:#0b1a12;transition:all .4s}
.seat.empty{border:1.5px dashed rgba(255,255,255,.25);color:var(--dim);background:none}
.seat.waiting{background:radial-gradient(circle at 35% 30%,#78828a,#343c3e 60%,#1b2122);color:#aab3b1}
.seat.paid{background:radial-gradient(circle at 35% 30%,#d4ffe8,#50d795 55%,#196a47)}
.seat.recv{box-shadow:0 0 0 4px rgba(168,232,197,.35)}
.seat i{position:absolute;right:-4px;bottom:-4px;width:20px;height:20px;border-radius:50%;background:#0c1412;border:1px solid var(--mint);color:var(--mint);font-size:11px;font-style:normal;display:flex;align-items:center;justify-content:center}
.recvtag{position:absolute;font-size:10px;letter-spacing:.1em;color:var(--mint);transform:translate(-50%,-50%)}
table{width:100%;border-collapse:collapse}td{padding:7px 0;font-size:15px;color:var(--mut)}td:last-child{text-align:right;color:var(--tx);font-weight:500}tr.hl td:last-child{color:var(--mint)}
.cd{font-size:30px;font-weight:300;font-variant-numeric:tabular-nums}
.led{list-style:none;padding:0;font-size:14px;color:var(--mut)}.led li{padding:9px 0;border-top:1px solid var(--line);display:flex;gap:10px}.led li:first-child{border-top:0}.led time{color:var(--dim);min-width:64px;white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;background:var(--green);margin-top:8px;flex:none}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;padding:20px;z-index:9}
.modal .card{max-width:380px;width:100%;background:#10161a}
.demo{margin-top:20px;border:1px dashed rgba(255,255,255,.2);border-radius:18px;padding:16px}
.demo .tag{margin-bottom:6px}
.sm{padding:11px 14px;font-size:14px;margin-top:8px}
.copy{display:flex;gap:8px;margin-top:10px}.copy input{font-size:13px}.copy button{flex:none;width:auto;margin:0;padding:0 18px}
</style>
</head>
<body>
<div class="glow"></div>
<header>
  <div class="brand">
    <svg width="30" height="30" viewBox="0 0 64 64"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#B9F7D6"/><stop offset="1" stop-color="#3FD68B"/></linearGradient></defs><rect width="64" height="64" rx="18" fill="url(#g)"/><circle cx="32" cy="32" r="17" fill="none" stroke="#0B0F0D" stroke-opacity=".35" stroke-width="1.5"/><circle cx="32" cy="15" r="6" fill="#0B0F0D"/><circle cx="46.7" cy="23.5" r="4.2" fill="#0B0F0D"/><circle cx="46.7" cy="40.5" r="4.2" fill="#0B0F0D"/><circle cx="32" cy="49" r="4.2" fill="#0B0F0D"/><circle cx="17.3" cy="40.5" r="4.2" fill="#0B0F0D"/><circle cx="17.3" cy="23.5" r="4.2" fill="#0B0F0D"/></svg>
    AjoLabs
  </div>
  <div style="display:flex;align-items:center;gap:14px"><a class="nav" href="/how-it-works.html">How it works</a><div class="pill" id="mode"></div></div>
</header>
<main id="app"></main>

<script>
const $ = s => document.querySelector(s);
const naira = n => '₦' + Number(n).toLocaleString('en-NG');
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
// Bank codes are placeholders. Swap for the bank IDs Paga expects.
const BANKS = [['Access Bank', '044'], ['GTBank', '058'], ['First Bank', '011'], ['UBA', '033'], ['Zenith Bank', '057'], ['Wema Bank', '035'], ['Sterling Bank', '232'], ['Opay', '999992'], ['Kuda', '50211'], ['Moniepoint', '50515']];
let skew = 0, mode = 'mock', cid = new URLSearchParams(location.search).get('c'), timer = null, tick = null, deadline = null, cycle = 7;

async function api(path, body) {
  const opt = body === undefined ? undefined : { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) };
  const r = await fetch(path, opt); const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || 'Something went wrong'); return j;
}
const meKey = () => 'ajo_me_' + cid;
const me = () => { try { return localStorage.getItem(meKey()); } catch { return null; } };
const setMe = id => { try { localStorage.setItem(meKey(), id); } catch {} };
const bankOpts = BANKS.map(([n, c]) => `<option value="${c}">${n}</option>`).join('');
const personFields = `
  <label>Your name</label><input id="pname" placeholder="e.g. Emem" autocomplete="name">
  <div class="row"><div><label>Phone</label><input id="pphone" inputmode="tel" placeholder="080..."></div><div><label>Bank</label><select id="pbank">${bankOpts}</select></div></div>
  <label>Account number (where your payout goes)</label><input id="pacct" inputmode="numeric" maxlength="10" placeholder="10 digits">`;
const person = () => ({ name: $('#pname').value.trim(), phone: $('#pphone').value.trim(), bankCode: $('#pbank').value, accountNumber: $('#pacct').value.trim() });
function needPerson(p) { if (!p.name) throw new Error('Add your name'); if (!/^\d{10}$/.test(p.accountNumber)) throw new Error('Account number should be 10 digits'); }

/* ---------- create ---------- */
function viewCreate() {
  clearInterval(timer); clearInterval(tick);
  $('#app').innerHTML = `
  <div class="grid">
    <div style="padding-top:20px">
      <div class="eyebrow">AjoLabs</div>
      <h1>Save together.<br><em>Paid out by Paga.</em></h1>
      <p class="sub">Start a private savings circle with people you trust. Everyone pays in, one person receives the pot each round, and the countdown restarts after every payout.</p>
    </div>
    <div class="card">
      <label style="margin-top:0">Circle name</label><input id="cname" placeholder="e.g. Oron Girls Ajo">
      <div class="row"><div><label>Each person pays (₦)</label><input id="camt" inputmode="numeric" value="5000"></div>
      <div><label>Members (3 to 10)</label><input id="cmax" inputmode="numeric" value="5"></div></div>
      <label>How often</label>
      <div class="seg" id="cseg"><button data-d="7" class="on">Weekly</button><button data-d="14">Every 2 weeks</button><button data-d="30">Monthly</button></div>
      ${personFields}
      <div class="err" id="err"></div>
      <button class="btn" id="go" style="margin-top:8px">Create circle</button>
    </div>
  </div>`;
  cycle = 7;
  document.querySelectorAll('#cseg button').forEach(b => b.onclick = () => { document.querySelectorAll('#cseg button').forEach(x => x.classList.remove('on')); b.classList.add('on'); cycle = +b.dataset.d; });
  $('#go').onclick = async () => {
    try {
      const p = person(); needPerson(p); $('#go').disabled = true;
      const c = await api('/api/circles', { name: $('#cname').value.trim() || 'My Ajo', amount: +$('#camt').value, maxMembers: +$('#cmax').value, cycleDays: cycle, creator: p });
      cid = c.id; setMe(c.members[0].id); history.pushState({}, '', '?c=' + cid); route();
    } catch (e) { $('#err').textContent = e.message; $('#go').disabled = false; }
  };
}

/* ---------- join ---------- */
function viewJoin(c) {
  clearInterval(timer);
  $('#app').innerHTML = `
  <div class="grid">
    <div style="padding-top:20px"><div class="eyebrow">You are invited</div><h1>Join <em>${esc(c.name)}</em></h1>
      <p class="sub">${naira(c.amount)} each, ${c.cycleDays === 7 ? 'weekly' : c.cycleDays === 14 ? 'every 2 weeks' : 'monthly'}. ${c.members.length} of ${c.maxMembers} seats taken.</p></div>
    <div class="card">${personFields}<div class="err" id="err"></div><button class="btn" id="go" style="margin-top:8px">Join circle</button></div>
  </div>`;
  $('#go').onclick = async () => {
    try {
      const p = person(); needPerson(p); $('#go').disabled = true;
      const r = await api(`/api/circles/${cid}/join`, p); setMe(r.members[r.members.length - 1].id); route();
    } catch (e) { $('#err').textContent = e.message; $('#go').disabled = false; }
  };
}

/* ---------- circle ---------- */
function orbit(c) {
  const R = 125, cx = 170, cy = 170; let html = '<div class="ring"></div>';
  for (let i = 0; i < c.maxMembers; i++) {
    const a = (-90 + (360 / c.maxMembers) * i) * Math.PI / 180, x = cx + R * Math.cos(a), y = cy + R * Math.sin(a), m = c.members[i];
    const isRecv = c.status === 'active' && i === c.round - 1;
    if (!m) { html += `<div class="seat empty" style="left:${x}px;top:${y}px">+</div>`; continue; }
    const done = c.status === 'deposits' ? m.deposit > 0 : (c.status === 'active' && m.paid);
    html += `<div class="seat ${done ? 'paid' : 'waiting'} ${isRecv ? 'recv' : ''}" style="left:${x}px;top:${y}px">${esc(m.name[0].toUpperCase())}${done ? '<i>✓</i>' : ''}</div>`;
    if (isRecv && i === 0) html += `<div class="recvtag" style="left:${cx + (R + 52) * Math.cos(a)}px;top:${cy + (R + 52) * Math.sin(a)}px">RECEIVES</div>`;
  }
  const paid = c.members.filter(m => m.paid).length, deps = c.members.filter(m => m.deposit > 0).length;
  const hub = c.status === 'filling' ? `<b>${c.members.length}/${c.maxMembers}</b><span>seats taken</span>`
    : c.status === 'deposits' ? `<b>${deps}/${c.maxMembers}</b><span>deposits paid</span>`
    : c.status === 'completed' ? `<b>Done</b><span>everyone was paid</span>` : `<b>${naira(paid * c.amount)}</b><span>of ${naira(c.pot)}</span>`;
  return `<div class="stage">${html}<div class="hub">${hub}</div></div>`;
}
const fmtCd = ms => { if (ms <= 0) return 'Deadline passed'; const s = Math.floor(ms / 1000), d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60); return `${d}d ${String(h).padStart(2, '0')}h ${String(m).padStart(2, '0')}m ${String(s % 60).padStart(2, '0')}s`; };

function viewCircle(c) {
  deadline = c.deadline; const mine = c.members.find(m => m.id === me());
  const link = location.origin + location.pathname + '?c=' + c.id;
  const freq = c.cycleDays === 7 ? 'weekly' : c.cycleDays === 14 ? 'every 2 weeks' : 'monthly';
  const btn = (id, t, dis) => `<button class="btn" id="${id}" ${dis ? 'disabled' : ''}>${t}</button>`;
  let action = '';
  if (c.status === 'deposits' && mine) action = mine.deposit ? btn('x', 'Deposit paid. Waiting for the others', 1) : btn('dep', `Pay ${naira(c.amount)} deposit with Paga`);
  else if (c.status === 'active' && mine) action = mine.paid ? btn('x', 'You have paid this round', 1) : btn('pay', `Pay ${naira(c.amount)} with Paga`);
  const settle = c.canSettle ? `<div class="card warn"><b>The deadline and grace period have passed.</b> Anyone can run settlement. Each missed payment is covered from the member's holdback, then their deposit, then the default pool, and the member gets a default mark.<button class="btn" id="settle">Run settlement</button></div>` : '';
  const prot = mine && (c.status === 'deposits' || c.status === 'active') ? `<div class="card" style="margin-top:16px"><div class="eyebrow" style="margin:0 0 6px">Your protection</div><table>
    <tr><td>Deposit held</td><td>${naira(mine.deposit)}</td></tr><tr><td>Holdback held</td><td>${naira(mine.hb)}</td></tr>
    <tr><td>Trust tier</td><td>${esc(mine.tierLabel)}</td></tr><tr><td>Holdback on your payout</td><td>${mine.tierPct}%</td></tr></table>
    <div class="tag" style="margin-top:8px">Deposits come back at the end. <a class="nav" href="/how-it-works.html" style="color:var(--mint)">How it works</a></div></div>` : '';
  const inv = c.status === 'filling' ? `
    <div class="card" style="margin-top:16px"><div class="eyebrow" style="margin:0 0 6px">Invite members</div>
      <div class="tag">Only people with this link can join.</div>
      <div class="copy"><input readonly value="${link}" id="lnk"><button class="btn ghost" id="cp">Copy</button></div>
      <a class="btn" style="text-align:center;text-decoration:none;margin-top:10px" target="_blank" href="https://wa.me/?text=${encodeURIComponent('Join my Ajo circle "' + c.name + '": ' + link)}">Share on WhatsApp</a></div>` : '';
  let demo = '';
  if (mode === 'mock') {
    const b2 = (id, t) => `<button class="btn ghost sm" id="${id}">${t}</button>`;
    demo = `<div class="demo"><div class="tag">Demo tools (mock mode only)</div>` +
      (c.status === 'filling' ? b2('dfill', 'Fill the empty seats with demo members') : '') +
      (c.status === 'deposits' ? b2('ddep', 'Make everyone else pay their deposit') : '') +
      (c.status === 'active' ? b2('dpay', 'Make everyone else pay') + b2('dpay1', 'Everyone else pays, except one') + b2('dskip', 'Skip to the deadline and grace period') : '') + '</div>';
  }
  const rows = c.status === 'active' ? `<tr><td>Holdback kept (${c.receiverPct}%)</td><td>−${naira(c.receiverHoldback)}</td></tr><tr class="hl"><td>${esc(c.receiver)} receives</td><td>${naira(c.receiverNet)}</td></tr>` : '';
  const led = c.ledger.slice(-8).reverse().map(l => `<li><time>${new Date(l.at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</time><span>${esc(l.text)}</span></li>`).join('');
  const top = c.status === 'filling' ? 'Filling up' : c.status === 'deposits' ? 'Deposits' : c.status === 'completed' ? 'Complete' : 'Round ' + c.round + ' of ' + c.maxMembers;
  const cd = c.status === 'active' ? `<div class="card" style="margin-top:20px"><div class="tag">${c.round === 1 ? 'Round 1 funding window' : 'Round ' + c.round + ' countdown'}</div><div class="cd" id="cd">${fmtCd(c.deadline - c.now)}</div>
        <div class="tag" style="margin-top:6px">${c.round === 1 ? 'Everyone has 24 hours to fund round 1.' : 'A fresh countdown starts after every payout. Then 24 hours of grace.'}</div></div>`
    : c.status === 'deposits' ? `<div class="card" style="margin-top:20px"><div class="tag">Before round 1</div><div style="font-size:15px;line-height:1.6;margin-top:6px">Everyone pays a ${naira(c.amount)} deposit. It is held for the whole circle and returned at the end.</div></div>` : '';
  skew = c.now - Date.now();
  $('#app').innerHTML = `
  <div class="grid">
    <div>
      <div class="eyebrow">${top}</div>
      <h1 style="font-size:clamp(30px,5vw,46px)">${esc(c.name)}</h1>
      <p class="sub" style="margin-top:8px">${naira(c.amount)} each, ${freq}</p>
      ${cd}${settle}${action}${prot}${inv}${demo}<div class="err" id="err"></div>
    </div>
    <div>
      ${orbit(c)}
      <div class="card" style="margin-top:22px"><table><tr><td>Pot</td><td>${naira(c.pot)}</td></tr><tr><td>Service fee (1%)</td><td>${naira(c.fee)}</td></tr>${rows}<tr><td>Default pool</td><td>${naira(c.pool)}</td></tr></table></div>
      <div class="card" style="margin-top:16px"><div class="eyebrow" style="margin:0 0 6px">Activity</div><ul class="led">${led}</ul></div>
    </div>
  </div>`;
  const on = (id, fn) => { const el = $(id); if (el) el.onclick = async () => { try { el.disabled = true; await fn(); } catch (e) { $('#err').textContent = e.message; el.disabled = false; } }; };
  const others = f => c.members.filter(m => m.id !== me() && f(m));
  const pays = async (list, kind) => { for (const m of list) { const r = await api(`/api/circles/${cid}/${kind}/${m.id}`, {}); await api('/api/dev/simulate-pay', { reference: r.reference }); } load(); };
  on('#cp', async () => { try { await navigator.clipboard.writeText(link); $('#cp').textContent = 'Copied'; } catch { $('#lnk').select(); } $('#cp').disabled = false; });
  on('#dep', () => payFlow(c, 'deposit')); on('#pay', () => payFlow(c, 'pay'));
  on('#settle', async () => { await api(`/api/circles/${cid}/settle`, {}); load(); });
  on('#ddep', () => pays(others(m => !m.deposit), 'deposit'));
  on('#dpay', () => pays(others(m => !m.paid), 'pay'));
  on('#dpay1', () => { const l = others(m => !m.paid); l.pop(); return pays(l, 'pay'); });
  on('#dskip', async () => { await api('/api/dev/skip-time', { id: cid }); load(); });
  on('#dfill', async () => { const names = ['Tunde', 'Amina', 'Nne', 'Yusuf', 'Ife', 'Bola', 'Chidi', 'Zainab', 'Kemi']; let i = 0;
    for (let k = c.members.length; k < c.maxMembers; k++) await api(`/api/circles/${cid}/join`, { name: names[i++], phone: '0800000000' + i, bankCode: '058', accountNumber: '01234567' + (10 + i) }); load(); });
}

async function payFlow(c, kind) {
  const r = await api(`/api/circles/${cid}/${kind}/${me()}`, {});
  if (mode !== 'mock') { location.href = r.checkoutUrl; return; }
  const m = document.createElement('div'); m.className = 'modal';
  m.innerHTML = `<div class="card"><div class="eyebrow">Paga checkout (demo)</div><h1 style="font-size:28px">${kind === 'deposit' ? 'Pay deposit ' : 'Pay '}${naira(c.amount)}</h1>
    <p class="sub" style="font-size:14px">In live mode this opens Paga. Here we fake the payment so you can see the whole flow.</p>
    <button class="btn" id="ok">Simulate successful payment</button><button class="btn ghost" id="no">Cancel</button></div>`;
  document.body.appendChild(m);
  $('#no').onclick = () => { m.remove(); load(); };
  $('#ok').onclick = async () => { await api('/api/dev/simulate-pay', { reference: r.reference }); m.remove(); load(); };
}

async function load() {
  try {
    const c = await api('/api/circles/' + cid);
    const isMember = c.members.some(m => m.id === me());
    if (!isMember && c.status === 'filling') { if (!$('#pname')) viewJoin(c); return; }
    if ($('.modal')) return; viewCircle(c);
  } catch (e) { $('#app').innerHTML = `<div class="card" style="max-width:420px;margin:40px auto"><h1 style="font-size:28px">Circle not found</h1><p class="sub">${esc(e.message)}</p><button class="btn" onclick="location.href=location.pathname">Start a circle</button></div>`; clearInterval(timer); }
}
function route() {
  clearInterval(timer); clearInterval(tick);
  if (!cid) return viewCreate();
  load(); timer = setInterval(() => { if (!document.activeElement || !['INPUT', 'SELECT'].includes(document.activeElement.tagName)) load(); }, 3000);
  tick = setInterval(() => { const el = $('#cd'); if (el && deadline) el.textContent = fmtCd(deadline - (Date.now() + skew)); }, 1000);
}
fetch('/health').then(r => r.json()).then(h => { mode = h.mode; $('#mode').textContent = mode === 'mock' ? 'Demo mode' : 'Paga test mode'; }).catch(() => {}).finally(route);
window.onpopstate = () => { cid = new URLSearchParams(location.search).get('c'); route(); };
</script>
